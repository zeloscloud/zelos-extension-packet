[project]
name = "zelos-extension-packet"
version = "0.1.0"
description = "Capture live network traffic or decode pcap and pcapng files (Linux, Apple silicon Macs) into packets in a Wireshark-style Packet List, with SOME/IP, SOME/IP-SD and DoIP decoded and SOME/IP payloads read from ARXML."
authors = [{ name = "Zelos", email = "support@zeloscloud.io" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["zelos", "extension", "packet", "pcap", "network"]
dependencies = [
    "zelos-sdk>=0.0.13a1",
    "rich-click>=1.8.0",
    # Pinned: the extension calls the native API directly, so the two ship in lockstep.
    "zelos-packet==0.0.4",
]

[project.scripts]
zelos-extension-packet = "main:cli"

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-packet"
Repository = "https://github.com/zeloscloud/zelos-extension-packet"
Issues = "https://github.com/zeloscloud/zelos-extension-packet/issues"
Documentation = "https://docs.zeloscloud.io/app/extensions/"

[project.optional-dependencies]
# Progress bars for `convert`; without tqdm it logs an install hint and converts unchanged.
cli = [
    "tqdm>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_packet"]

# The console script `main:cli` lives outside the package.
[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
