name = "Packet"
version = "0.1.0"
description = "Capture live network traffic or decode pcap and pcapng files (Linux, Apple silicon Macs) into packets in a Wireshark-style Packet List, with SOME/IP, SOME/IP-SD and DoIP decoded and SOME/IP payloads read from ARXML."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-packet"
# At most 20 keywords and 10 categories. Marketplace search matches both, the name, description,
# author and repository. Zelos AI sees the name, description and keywords, not the categories.
keywords = ["packet", "pcap", "network", "ethernet", "tcpdump", "sniffer", "packet capture", "wireshark", "network analyzer", "someip", "some ip", "autosar", "iso 13400", "uds", "automotive ethernet", "vlan", "tcp", "udp", "arp", "icmp"]
categories = ["Networking", "Industrial", "IoT", "Automotive", "Diagnostics"]
icon = "assets/icon.png"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"
targets = ["linux-x86_64", "linux-aarch64", "darwin-arm64"]

[agent.stop]
grace_seconds = 15

[[app.panels]]
id = "packet-list"
name = "Packet List"
description = "Captured network packets"
icon = "assets/packet-list.svg"
entry = "dist/panels/packet-list.html"
accepts = ["zelos.packet."]               # event-type prefixes (e.g. "acme.sensor.reading.") a drop routes to this panel
companions = ["zelos.packet.stats."]      # prefixes that ride along with an accepted drop
binds = "accepted"                        # "any" or "accepted"
default_height = 2
live_only = false
options_schema = "dist/panels/packet-list.options.json"
ai_guidance = "Captured network traffic: a packet list with source, destination, protocol and length."

[package]
paths = ["LICENSE", "main.py", "zelos_extension_packet", "dist", "assets"]
